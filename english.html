<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stellenbosch Museum - English Tour</title>
    <link rel="stylesheet" href="pages.css">
</head>
<body>
<!-- Back button -->
<a href="index.html" class="back-btn">← Back</a>

<!-- Scanning Mode -->
<div id="scanningMode" class="scanning-mode">
    <h1>Please scan an exhibit code</h1>
    <div id="reader"></div>
    <div class="scan-status">Position the QR code within the camera view</div>
</div>

<!-- Display Mode -->
<div id="displayMode" class="display-mode hidden">
    <div id="contentArea" class="content-area">
        <div class="loading">Loading exhibit information</div>
    </div>
    <div class="bottom-bar">
        <button id="scanNextBtn" class="scan-next-btn">Scan Next Code</button>
    </div>
</div>

<!-- Include html5-qrcode library from CDN -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<!-- Include external JavaScript -->
<script src="pages.js"></script>
</body>
</html>
