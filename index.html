<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stellenbosch Museum</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="container">
    <img src="svg/logo.svg" alt="Stellenbosch Museum Logo" class="logo">
    <div class="language-buttons">
        <a href="scan.html" class="language-btn" onclick="setLanguage('en')">English</a>
        <a href="scan.html" class="language-btn" onclick="setLanguage('af')">Afrikaans</a>
        <a href="scan.html" class="language-btn" onclick="setLanguage('xh')">isiXhosa</a>
        <a href="scan.html" class="language-btn" onclick="setLanguage('ja')">日本語</a>
    </div>
</div>

<script>
    function setLanguage(lang) {
        sessionStorage.setItem('museumLang', lang);
    }
</script>
</body>
</html>
